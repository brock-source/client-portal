<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StoneCentury Financial — Client Portal</title>
    <script>
        // GitHub Pages SPA Routing Fix
        // Redirect 404s to the root index.html with the path preserved as a query parameter
        const path = location.pathname.replace('/client-portal', '');
        const search = location.search;
        sessionStorage.redirect = path + search;
        location.replace('/client-portal/?redirect=' + encodeURIComponent(path + search));
    </script>
</head>
<body>
</body>
</html>
